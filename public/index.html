<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipSound</title>
<style>
  :root {
    --bg: #0c0e16; --panel: rgba(255,255,255,.05); --panel-solid: #171a25; --text: #f4f5fa; --muted: #8a8fa6;
    --line: rgba(255,255,255,.09); --accent-a: #ff5f6d; --accent-b: #ffc371; --danger: #ff3b5c;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(255,95,109,.16), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(127,127,213,.16), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* ---------- Kopfzeile ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 14px 20px;
    background: rgba(12,14,22,.72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 6px 20px rgba(255,95,109,.35);
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
  .count { color: var(--muted); font-size: 12px; font-weight: 500; }

  .searchwrap { position: relative; flex: 1 1 200px; min-width: 0; }
  .searchwrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  input[type=search] {
    width: 100%; padding: 11px 40px 11px 38px; border-radius: 12px; outline: none;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
    transition: border-color .15s, background .15s;
  }
  input[type=search]:focus { border-color: rgba(255,195,113,.6); background: rgba(255,255,255,.08); }
  .searchwrap kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
  kbd {
    font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: rgba(255,255,255,.04);
  }

  button { font: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 12px;
    font-weight: 650; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    transition: transform .08s, filter .15s, background .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.96); }
  .btn-upload { border: 0; color: #1a0f12; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); box-shadow: 0 6px 18px rgba(255,95,109,.3); }
  .btn-stop { border-color: rgba(255,59,92,.45); color: #ff8a9e; background: rgba(255,59,92,.12); }
  .btn-stop:hover { background: rgba(255,59,92,.22); }

  .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 550; cursor: pointer; user-select: none; height: 42px; padding: 0 4px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .track { width: 36px; height: 22px; border-radius: 99px; background: rgba(255,255,255,.14); position: relative; transition: background .15s; }
  .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .track { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent-b); outline-offset: 2px; }

  .vol {
    display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px;
  }
  .vol input { width: 130px; accent-color: var(--accent-b); }
  #volPct { min-width: 46px; text-align: right; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #volPct.boost { color: var(--danger); }

  /* ---------- Pads ---------- */
  main { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .pad {
    --g1: #ff5f6d; --g2: #ffc371;
    position: relative; overflow: hidden; height: 104px; padding: 12px 14px;
    border-radius: 18px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: flex-end;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 8px 24px -10px var(--g1);
    color: #fff; font-weight: 750; font-size: 15px; line-height: 1.2; letter-spacing: -.01em;
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
    transition: transform .08s ease, box-shadow .2s, filter .15s;
  }
  .pad::before { /* Glanz */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 45%);
  }
  .pad:hover { filter: brightness(1.08) saturate(1.05); transform: translateY(-2px); }
  .pad:active { transform: scale(.95); }
  .pad .name { position: relative; z-index: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .pad .key {
    position: absolute; top: 10px; left: 12px; z-index: 1; min-width: 22px; height: 22px; padding: 0 6px;
    display: grid; place-items: center; text-shadow: none;
    font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff;
    background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.25); border-radius: 7px;
  }
  .pad .del {
    position: absolute; top: 8px; right: 8px; z-index: 2; height: 26px; min-width: 26px; padding: 0 7px;
    border-radius: 8px; border: 0; background: rgba(0,0,0,.28); color: #fff; font-size: 12px; font-weight: 700;
    opacity: 0; transition: opacity .12s, background .12s;
  }
  .pad:hover .del, .pad .del.confirm { opacity: 1; }
  .pad .del:hover { background: rgba(0,0,0,.45); }
  .pad .del.confirm { background: var(--danger); }
  @media (hover: none) { .pad .del { opacity: .85; } }
  .pad .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; z-index: 1; background: rgba(255,255,255,.95); box-shadow: 0 0 10px #fff; }
  .pad .wave { position: absolute; right: 12px; bottom: 12px; z-index: 1; display: none; gap: 3px; align-items: flex-end; height: 16px; }
  .pad .wave i { width: 3px; background: #fff; border-radius: 2px; animation: wave .8s ease-in-out infinite; }
  .pad .wave i:nth-child(2) { animation-delay: -.25s; } .pad .wave i:nth-child(3) { animation-delay: -.5s; }
  @keyframes wave { 0%,100% { height: 4px; } 50% { height: 16px; } }
  .pad.playing { box-shadow: 0 0 0 3px #fff, 0 0 32px -2px var(--g1); }
  .pad.playing .wave { display: flex; }
  .pad.playing .name { padding-right: 26px; }

  .empty {
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    color: var(--muted); padding: 72px 20px; border: 2px dashed var(--line); border-radius: 22px; background: var(--panel);
  }
  .empty .big { font-size: 46px; }
  .empty b { color: var(--text); font-size: 17px; }
  .empty[hidden] { display: none; }

  .hint { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; padding: 0 20px 24px; }

  .drop {
    position: fixed; inset: 12px; z-index: 10; display: none; flex-direction: column; gap: 8px; align-items: center; justify-content: center;
    border-radius: 24px; background: rgba(12,14,22,.9); border: 3px dashed var(--accent-b);
    font-size: 26px; font-weight: 800; color: var(--accent-b);
  }
  .drop span { font-size: 56px; }
  body.dragging .drop { display: flex; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); z-index: 20; opacity: 0; pointer-events: none;
    background: var(--panel-solid); border: 1px solid var(--line); padding: 11px 18px; border-radius: 12px;
    max-width: calc(100% - 32px); box-shadow: 0 12px 32px rgba(0,0,0,.4); transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: rgba(255,59,92,.6); color: #ffb3c0; }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    main { padding: 16px; }
    .hint { padding: 0 16px 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .pad { height: 92px; }
    .vol { flex: 1; } .vol input { flex: 1; width: auto; }
    .searchwrap kbd { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔊</div>
    <div><h1>ClipSound</h1><div class="count" id="count"></div></div>
  </div>
  <label class="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="search" placeholder="Sound suchen…" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <button class="btn btn-upload" id="uploadBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Hochladen
  </button>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.opus,.m4a,.aac,.webm,.flac" multiple hidden>
  <button class="btn btn-stop" id="stopBtn" title="Alles stoppen (Esc)">
    <svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2.5" fill="currentColor"/></svg>
    Stop
  </button>
  <label class="switch" title="Mehrere Sounds gleichzeitig abspielen"><input type="checkbox" id="overlap"><span class="track"></span>Überlappen</label>
  <div class="vol" title="Doppelklick auf den Regler = 100 %">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    <input type="range" id="vol" min="0" max="5" step="0.05" value="0.8">
    <span id="volPct"></span>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div class="big">🎧</div>
    <b>Noch keine Sounds</b>
    Zieh MP3-, WAV- oder OGG-Dateien hier rein oder klick auf „Hochladen".
  </div>
</main>
<div class="hint">
  <span><kbd>1</kbd>–<kbd>0</kbd> <kbd>Q</kbd>–<kbd>P</kbd> spielen die ersten 20</span>
  <span><kbd>Esc</kbd> stoppt alles</span>
  <span><kbd>/</kbd> sucht, <kbd>Enter</kbd> spielt den ersten Treffer</span>
  <span>Dateien einfach reinziehen</span>
</div>

<div class="drop"><span>🎵</span>Sounds hier loslassen</div>
<div class="toast" id="toast"></div>

<script>
// Gleiche Farbverläufe wie in der Mac- und Windows-App
const GRADIENTS = [
  ['#ff5f6d','#ffc371'], ['#7f7fd5','#86a8e7'], ['#11998e','#38ef7d'], ['#fc466b','#3f5efb'],
  ['#f7971e','#ffb800'], ['#00c6ff','#0072ff'], ['#ee0979','#ff6a00'], ['#8e2de2','#4a00e0'],
];
const KEYS = ['1','2','3','4','5','6','7','8','9','0','q','w','e','r','t','z','u','i','o','p'];
const AUDIO_EXT = /\.(mp3|wav|ogg|opus|m4a|aac|webm|flac)$/i;

const $ = id => document.getElementById(id);
const grid = $('grid'), search = $('search'), vol = $('vol'), overlap = $('overlap');
let sounds = [];
const playing = new Set(); // aktuell laufende Audio-Objekte

// Lautstärke läuft über Web Audio, damit sie über 100 % (bis 500 %) gehen kann
let ctx, master;
function audioOut() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = vol.value;
    master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return master;
}
function showVol() {
  $('volPct').textContent = Math.round(vol.value * 100) + ' %';
  $('volPct').classList.toggle('boost', vol.value > 1);
}

try { overlap.checked = localStorage.getItem('overlap') === '1'; vol.value = localStorage.getItem('vol') ?? 0.8; } catch {}
showVol();
overlap.onchange = () => { try { localStorage.setItem('overlap', overlap.checked ? '1' : '0'); } catch {} };
vol.oninput = () => {
  if (master) master.gain.value = vol.value;
  showVol();
  try { localStorage.setItem('vol', vol.value); } catch {}
};
vol.ondblclick = () => { vol.value = 1; vol.oninput(); }; // Doppelklick = 100 %

function gradientFor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return GRADIENTS[h % GRADIENTS.length];
}

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2500);
}

async function load() {
  sounds = await (await fetch('/api/sounds')).json();
  render();
}

function visible() {
  const q = search.value.trim().toLowerCase();
  return q ? sounds.filter(s => s.toLowerCase().includes(q) || title(s).toLowerCase().includes(q)) : sounds;
}

// Anzeigename: ohne Endung, Bindestriche/Unterstriche als Leerzeichen
const title = name => name.replace(AUDIO_EXT, '').replace(/[-_]+/g, ' ');

function render() {
  const list = visible();
  grid.innerHTML = '';
  $('empty').hidden = sounds.length > 0;
  $('count').textContent = sounds.length === 1 ? '1 Sound' : `${sounds.length} Sounds`;
  list.forEach((name, i) => {
    const pad = document.createElement('div');
    pad.setAttribute('role', 'button');
    pad.className = 'pad';
    const [g1, g2] = gradientFor(name);
    pad.style.setProperty('--g1', g1); pad.style.setProperty('--g2', g2);
    pad.dataset.name = name;
    pad.innerHTML = `<div class="bar"></div>${KEYS[i] ? `<span class="key">${KEYS[i].toUpperCase()}</span>` : ''}<span class="name"></span><span class="wave"><i></i><i></i><i></i></span><button class="del" title="Löschen">✕</button>`;
    pad.querySelector('.name').textContent = title(name);
    pad.onclick = e => { if (!e.target.closest('.del')) play(name, pad); };
    pad.querySelector('.del').onclick = e => askDelete(e.currentTarget, name);
    grid.appendChild(pad);
  });
}

function stopAll() {
  playing.forEach(a => { a.pause(); a.onended?.(); });
  playing.clear();
}

function play(name, pad) {
  if (!overlap.checked) stopAll();
  const a = new Audio('/sounds/' + encodeURIComponent(name));
  const out = audioOut();
  ctx.createMediaElementSource(a).connect(out);
  const bar = pad?.querySelector('.bar');
  let raf;
  const tick = () => {
    if (bar && a.duration) bar.style.width = (a.currentTime / a.duration * 100) + '%';
    raf = requestAnimationFrame(tick);
  };
  a.onended = () => {
    cancelAnimationFrame(raf);
    playing.delete(a);
    if (bar) bar.style.width = 0;
    if (pad && ![...playing].some(p => p._pad === pad)) pad.classList.remove('playing');
  };
  a._pad = pad;
  playing.add(a);
  pad?.classList.add('playing');
  a.play().then(tick).catch(() => { a.onended(); toast('Konnte nicht abgespielt werden', true); });
}

function askDelete(btn, name) {
  if (!btn.classList.contains('confirm')) {
    btn.classList.add('confirm'); btn.textContent = 'Löschen?';
    setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = '✕'; }, 2500);
    return;
  }
  fetch('/sounds/' + encodeURIComponent(name), { method: 'DELETE' })
    .then(r => r.ok ? (toast('Gelöscht: ' + name), load()) : toast('Löschen fehlgeschlagen', true));
}

async function upload(files) {
  const list = [...files];
  let ok = 0;
  for (const f of list) {
    if (!AUDIO_EXT.test(f.name) && !f.type.startsWith('audio/')) { toast(`„${f.name}" ist kein Sound`, true); continue; }
    toast(`Lade hoch: ${f.name}…`);
    const r = await fetch('/api/sounds', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name) }, body: f });
    const data = await r.json().catch(() => ({}));
    if (r.ok) ok++; else toast(`${f.name}: ${data.error || 'Fehler'}`, true);
  }
  if (ok) { toast(`${ok} Sound${ok > 1 ? 's' : ''} hochgeladen 🎉`); load(); }
}

$('uploadBtn').onclick = () => $('file').click();
$('file').onchange = e => { upload(e.target.files); e.target.value = ''; };
$('stopBtn').onclick = stopAll;
search.oninput = render;

// Drag & Drop überall
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
});

// Tastenkürzel
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { stopAll(); search.blur(); return; }
  if (document.activeElement === search) { if (e.key === 'Enter') { const f = visible()[0]; if (f) play(f, grid.firstChild); } return; }
  if (e.key === '/') { e.preventDefault(); search.focus(); return; }
  const i = KEYS.indexOf(e.key.toLowerCase());
  const list = visible();
  if (i >= 0 && list[i]) { e.preventDefault(); play(list[i], grid.children[i]); }
});

load();
</script>
</body>
</html>
