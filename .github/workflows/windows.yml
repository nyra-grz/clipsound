name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      mac_lobby:
        description: 'Code einer offenen Lobby (z. B. vom Mac) – Windows tritt bei und drückt den ersten Sound'
        required: false

jobs:
  build-and-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bauen
        run: dotnet publish windows/ClipSound -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - name: Test-Sounds erzeugen (Sinustöne)
        shell: pwsh
        run: |
          $dir = "$pwd\testlib\Sounds"
          New-Item -ItemType Directory -Force $dir | Out-Null
          New-Item -ItemType Directory -Force "$pwd\empty\Sounds" | Out-Null
          New-Item -ItemType Directory -Force "$pwd\shots" | Out-Null
          $names = 'vine-boom','bruh','airhorn','metal-pipe-clang','sad-violin','wow','oof','emotional-damage','windows-error','taco-bell-bong','among-us-drip-theme-song','dun-dun-dun'
          $i = 0
          foreach ($n in $names) {
            $rate = 22050; $count = 22050; $freq = 220 + 40 * $i; $i++
            $ms = New-Object IO.MemoryStream; $bw = New-Object IO.BinaryWriter($ms)
            $bw.Write([Text.Encoding]::ASCII.GetBytes('RIFF')); $bw.Write([int](36 + $count * 2))
            $bw.Write([Text.Encoding]::ASCII.GetBytes('WAVEfmt ')); $bw.Write([int]16); $bw.Write([int16]1); $bw.Write([int16]1)
            $bw.Write([int]$rate); $bw.Write([int]($rate * 2)); $bw.Write([int16]2); $bw.Write([int16]16)
            $bw.Write([Text.Encoding]::ASCII.GetBytes('data')); $bw.Write([int]($count * 2))
            for ($s = 0; $s -lt $count; $s++) { $bw.Write([int16](8000 * [Math]::Sin(2 * [Math]::PI * $freq * $s / $rate))) }
            [IO.File]::WriteAllBytes("$dir\$n.wav", $ms.ToArray())
          }

      - name: App starten – Screenshots und Selbsttest
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $script:n = 0
          function Run($argList) {
            $p = Start-Process "$pwd\out\ClipSound.exe" -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(60000)) {
              # Bildschirm fotografieren, um zu sehen, woran es hängt
              $script:n++
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$pwd\shots\haengt-$script:n.png")
              $p.Kill(); Write-Host "Zeitüberschreitung: $argList"
            }
            $crash = Join-Path $env:TEMP 'clipsound-crash.txt'
            if (Test-Path $crash) { Write-Host "ABSTURZ:"; Get-Content $crash; Move-Item $crash "$pwd\shots\absturz-$(Get-Random).txt" }
          }
          Run @('--library', "$pwd\testlib\Sounds", '--snapshot', "$pwd\shots\1-normal.png", '--selftest', "$pwd\shots\selftest.txt", '--import-test', "$pwd\windows\testdata")
          Run @('--library', "$pwd\testlib\Sounds", '--size', '700x600', '--snapshot', "$pwd\shots\2-schmal.png", '--selftest', "$pwd\shots\selftest-schmal.txt")
          Run @('--library', "$pwd\testlib\Sounds", '--recorder', '--snapshot', "$pwd\shots\3-taste.png")
          Run @('--library', "$pwd\empty\Sounds", '--snapshot', "$pwd\shots\4-leer.png")
          Run @('--library', "$pwd\testlib\Sounds", '--pretend-version', '1.0', '--snapshot', "$pwd\shots\5-update.png")
          Run @('--library', "$pwd\testlib\Sounds", '--settings', '--snapshot', "$pwd\shots\7-einstellungen.png")
          Run @('--library', "$pwd\testlib\Sounds", '--icon', "$pwd\shots\4-leer.png", '--settings', '--snapshot', "$pwd\shots\8-eigenes-icon.png")
          Remove-Item "$env:APPDATA\ClipSound\AppIcon.png" -ErrorAction SilentlyContinue
          Get-ChildItem shots
          Get-ChildItem shots -Filter *.txt | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName }

      - name: Update testen (tut so, als wäre 1.0 installiert)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force upd | Out-Null
          Copy-Item out\ClipSound.exe upd\ClipSound.exe
          $before = (Get-FileHash upd\ClipSound.exe).Hash
          Start-Process "$pwd\upd\ClipSound.exe" -ArgumentList '--library', "$pwd\testlib\Sounds", '--pretend-version', '1.0', '--update-now'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            if ((Get-FileHash upd\ClipSound.exe -ErrorAction SilentlyContinue).Hash -ne $before) { $ok = $true; break }
          }
          Start-Sleep 8   # neue Version startet und räumt die alte weg
          $running = Get-Process ClipSound -ErrorAction SilentlyContinue
          $report = @(
            "exe ausgetauscht: $ok (nach $($i * 2) s)",
            "neue Version läuft: $([bool]$running)",
            "alte exe weggeräumt: $(-not (Test-Path upd\ClipSound.exe.old))",
            "Version der neuen exe: $((Get-Item upd\ClipSound.exe).VersionInfo.ProductVersion)"
          )
          $report | Tee-Object shots\update-test.txt
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }

      - name: Globaler Kürzel Alt+2 (App im Hintergrund)
        shell: pwsh
        run: |
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public class K { [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra); }
          '@
          $p = Start-Process "$pwd\out\ClipSound.exe" -ArgumentList '--library', "$pwd\testlib\Sounds", '--hotkey-test', "$pwd\shots\hotkey.txt" -PassThru
          Start-Sleep 5
          # anderes Fenster nach vorne, damit ClipSound wirklich im Hintergrund ist
          Start-Process notepad; Start-Sleep 2
          [K]::keybd_event(0x12, 0, 0, [UIntPtr]::Zero); [K]::keybd_event(0x32, 0, 0, [UIntPtr]::Zero)
          [K]::keybd_event(0x32, 0, 2, [UIntPtr]::Zero); [K]::keybd_event(0x12, 0, 2, [UIntPtr]::Zero)
          $p.WaitForExit(30000) | Out-Null
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content shots\hotkey.txt
          if (-not (Select-String -Path shots\hotkey.txt -Pattern 'ausgelöst für' -Quiet)) { Write-Host 'Alt+2 hat nicht ausgelöst'; exit 1 }

      - name: Sounds wandern auf den Desktop (nichts geht verloren)
        shell: pwsh
        run: |
          $old = "$env:APPDATA\ClipSound\Sounds"; $desk = [Environment]::GetFolderPath('DesktopDirectory') + '\Sounds'
          New-Item -ItemType Directory -Force $old, $desk | Out-Null
          Copy-Item testlib\Sounds\bruh.wav "$old\A.wav"
          Copy-Item testlib\Sounds\wow.wav "$old\Gleich.wav"
          Copy-Item testlib\Sounds\oof.wav "$desk\Gleich.wav"
          $p = Start-Process "$pwd\out\ClipSound.exe" -ArgumentList '--snapshot', "$pwd\shots\6-desktop.png" -PassThru
          $p.WaitForExit(60000) | Out-Null
          Write-Host "Desktop\Sounds:"; Get-ChildItem $desk | ForEach-Object Name
          Write-Host "alter Ordner:"; if (Test-Path $old) { Get-ChildItem $old | ForEach-Object Name } else { '(weg, war leer)' }
          $names = (Get-ChildItem $desk).Name
          if (-not ($names -contains 'A.wav' -and $names -contains 'Gleich (2).wav' -and $names -contains 'Gleich.wav')) { exit 1 }
          if ((Get-FileHash "$desk\Gleich.wav").Hash -ne (Get-FileHash testlib\Sounds\oof.wav).Hash) { Write-Host 'Desktop-Datei überschrieben!'; exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lobby (Crossplay mit dem echten Server)
        shell: pwsh
        run: |
          cd cloud; npm ci --silent; cd ..
          $url = 'https://rooms-production-8e28.up.railway.app'
          New-Item -ItemType Directory -Force guestlib\Sounds | Out-Null

          # 1) Fremder Host (gleiches Protokoll wie Mac/Browser), Windows tritt bei
          $hostLog = "$pwd\shots\lobby-node-host.txt"
          $h = Start-Process node -ArgumentList 'cloud/lobby-tool.mjs', 'host', $url, "$pwd\windows\testdata", '60' -RedirectStandardOutput $hostLog -PassThru -NoNewWindow
          for ($i = 0; $i -lt 30 -and -not (Select-String -Path $hostLog -Pattern 'CODE' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          $code = ((Select-String -Path $hostLog -Pattern 'CODE (\w+)').Matches[0].Groups[1].Value)
          Write-Host "Lobby vom Testhost: $code"
          $g = Start-Process "$pwd\out\ClipSound.exe" -ArgumentList '--library', "$pwd\guestlib\Sounds", '--lobby-join', $code.ToLower(), '--lobby-play-first', '--lobby-accept', '--lobby-log', "$pwd\shots\lobby-win-gast.txt", '--lobby-exit-after', '25' -PassThru
          $g.WaitForExit(60000) | Out-Null
          Write-Host '== Windows als Gast'; Get-Content shots\lobby-win-gast.txt
          Write-Host '== Testhost'; Get-Content $hostLog | ForEach-Object { $_.Substring(0, [Math]::Min(150, $_.Length)) }

          # 2) Windows ist Host, fremder Gast tritt bei, drückt und fragt
          $winLog = "$pwd\shots\lobby-win-host.txt"
          $w = Start-Process "$pwd\out\ClipSound.exe" -ArgumentList '--library', "$pwd\testlib\Sounds", '--lobby-host', '--lobby-accept', '--lobby-log', $winLog, '--lobby-exit-after', '30' -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            if ((Test-Path $winLog) -and (Select-String -Path $winLog -Pattern 'hochgeladen=(\d+)/\1' -Quiet)) { break }
          }
          Write-Host "Windows-Host läuft noch: $(-not $w.HasExited)"
          if (Test-Path $winLog) { Get-Content $winLog } else { Write-Host '(kein Log vom Windows-Host)' }
          $crash = Join-Path $env:TEMP 'clipsound-crash.txt'
          if (Test-Path $crash) { Write-Host 'ABSTURZ:'; Get-Content $crash }
          $code2 = if (Test-Path $winLog) { ((Select-String -Path $winLog -Pattern 'code=(\w{5})').Matches | Select-Object -First 1).Groups[1].Value } else { '' }
          if (-not $code2) { Write-Host 'Windows-Host hat keine Lobby geöffnet'; exit 1 }
          Write-Host "Windows-Lobby: $code2"
          node cloud/lobby-tool.mjs guest $url $code2 10 | Tee-Object shots\lobby-node-gast.txt | ForEach-Object { $_.Substring(0, [Math]::Min(150, $_.Length)) }
          $w.WaitForExit(60000) | Out-Null
          Write-Host '== Windows als Host'; Get-Content $winLog

          # 3) Optional: echte Lobby vom Mac
          if ('${{ github.event.inputs.mac_lobby }}' -ne '') {
            $m = Start-Process "$pwd\out\ClipSound.exe" -ArgumentList '--library', "$pwd\guestlib\Sounds", '--lobby-join', '${{ github.event.inputs.mac_lobby }}', '--lobby-play-first', '--lobby-log', "$pwd\shots\lobby-mac.txt", '--lobby-exit-after', '30' -PassThru
            $m.WaitForExit(60000) | Out-Null
            Write-Host '== Windows in der Mac-Lobby'; Get-Content shots\lobby-mac.txt
          }

          $ok = (Select-String -Path shots\lobby-win-gast.txt -Pattern '^.* play ' -Quiet) -and
                ((Select-String -Path shots\lobby-win-gast.txt -Pattern 'bekommen' -AllMatches).Matches.Count -ge 2) -and
                (Select-String -Path $winLog -Pattern ' play ' -Quiet) -and
                (Select-String -Path shots\lobby-node-gast.txt -Pattern '"ok":true' -Quiet)
          if (-not $ok) { Write-Host 'Lobby-Test fehlgeschlagen'; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check
          path: shots
